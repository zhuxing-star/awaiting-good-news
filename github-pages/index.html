<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <meta name="description" content="送给朱佳音的一份生日祝福">
  <title>朱佳音，生日快乐</title>
  <link rel="preload" href="./images/birthday-star.jpg" as="image">
  <link rel="stylesheet" href="./style.css?v=20261002-4">
</head>
<body>
  <button class="music-button" id="music-button" type="button" aria-label="播放音乐"><span></span></button>

  <section class="start-sign" id="start-sign">
    <p>温馨提醒：打开声音，效果会更完整哦 😊</p>
    <button id="start-button" type="button">准备好了，我们开始吧！</button>
  </section>

  <main class="container" id="container" aria-hidden="true">
    <section class="one layer">
      <h1>你好啊 <strong>朱佳音</strong></h1>
      <p>今天，是属于你的日子。</p>
    </section>

    <section class="three layer"><p>今天是你的生日！</p></section>

    <section class="four layer">
      <div class="text-box">
        <p class="chat-text">朱佳音，生日快乐！愿你新的一岁平安顺遂，每天都有好心情。</p>
        <span class="fake-button">发送</span>
      </div>
    </section>

    <section class="five layer">
      <p class="idea idea-1">本来只想这样说。</p>
      <p class="idea idea-2">但我又认真想了想。</p>
      <p class="idea idea-3">只是四个字，好像还不够<strong>特别</strong>。</p>
      <p class="idea idea-4">因为，</p>
      <p class="idea idea-5"><span>你值得一个特别一点的生日</span><i>☺</i></p>
      <p class="idea idea-6"><span>所</span><span>以</span></p>
    </section>

    <section class="memories layer" aria-label="一起见过的风景">
      <figure class="memory memory-1"><img src="./images/jellyfish.jpg" alt="蓝色水族箱里发光的水母"></figure>
      <figure class="memory memory-2"><img src="./images/beluga.jpg" alt="深蓝水中游过的白鲸"></figure>
      <figure class="memory memory-3"><img src="./images/forest.jpg" alt="灯光下的森林与水面"></figure>
      <figure class="memory memory-4"><img src="./images/lizard.jpg" alt="岩石上的蜥蜴"></figure>
      <div class="memory-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </section>

    <section class="six layer">
      <div class="portrait-wrap">
        <img class="portrait" src="./images/birthday-star.jpg" alt="朱佳音在树下抱着尤克里里">
        <img class="hat" src="./images/template/hat.svg" alt="">
      </div>
      <div class="wish">
        <h2>生日快乐！</h2>
        <p>愿新的一岁，自由、明亮，始终被温柔以待。</p>
      </div>
    </section>

    <div class="balloons layer" aria-hidden="true">
      <img src="./images/template/balloon2.svg" alt=""><img src="./images/template/balloon1.svg" alt="">
      <img src="./images/template/balloon3.svg" alt=""><img src="./images/template/balloon1.svg" alt="">
      <img src="./images/template/balloon2.svg" alt=""><img src="./images/template/balloon3.svg" alt="">
      <img src="./images/template/balloon2.svg" alt=""><img src="./images/template/balloon3.svg" alt="">
      <img src="./images/template/balloon1.svg" alt=""><img src="./images/template/balloon2.svg" alt="">
      <img src="./images/template/balloon3.svg" alt=""><img src="./images/template/balloon1.svg" alt="">
    </div>

    <div class="color-bursts layer" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <section class="nine layer">
      <p>最后，还有一页想留给你。</p>
      <button id="open-card" type="button">打开贺卡</button>
    </section>

    <section class="card layer" aria-label="生日贺卡">
      <article>
        <p class="card-date">2026 · 10 · 28</p>
        <h2>朱佳音：</h2>
        <div class="card-copy">（这里留给你写想说的话）</div>
        <p class="signature">逐星</p>
      </article>
      <button id="replay" type="button">再看一次</button>
    </section>

    <canvas id="fireworks" aria-hidden="true"></canvas>
  </main>

  <script src="./vendor/gsap.min.js"></script>
  <script src="./script.js?v=20261002-4"></script>
</body>
</html>
